name: Set Repository Topics

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/set-topics.yml'

jobs:
  set-topics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      administration: write
    steps:
      - name: Apply topics via GitHub REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/topics \
            -H "Accept: application/vnd.github+json" \
            -f 'names[]=rust' \
            -f 'names[]=game-hacking' \
            -f 'names[]=reverse-engineering' \
            -f 'names[]=sdk-dumper' \
            -f 'names[]=ravenswatch' \
            -f 'names[]=passtech-games' \
            -f 'names[]=aob-scan' \
            -f 'names[]=pattern-scanning' \
            -f 'names[]=vtable-resolution' \
            -f 'names[]=custom-game-engine' \
            -f 'names[]=windows' \
            -f 'names[]=winapi' \
            -f 'names[]=memory-scanner' \
            -f 'names[]=game-modding' \
            -f 'names[]=cheat-development' \
            -f 'names[]=cpp-sdk' \
            -f 'names[]=stormancer' \
            -f 'names[]=raknet' \
            -f 'names[]=external-cheat' \
            -f 'names[]=world-to-screen'
